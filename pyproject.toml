[project]
name = "inspect-neuron"
version = "0.1.0"
description = "Find MLP neurons, blind-test agent explanations of them, and probe how to steer a neuron"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Simon Veitner" }]
dependencies = [
  "accelerate>=1.1",
  "datasets",
  "numpy",
  "tokenizers",
  "torch",
  "transformers>=4.51",
]

[project.scripts]
nn = "nn.cli:main"

[project.urls]
Repository = "https://github.com/simveit/inspect-neuron"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nn"]

[tool.setuptools.package-data]
nn = ["templates/*"]
