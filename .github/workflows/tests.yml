name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        # --no-build-isolation below needs setuptools in the environment.
        run: python -m pip install --upgrade pip setuptools numpy
      - name: Install the package and check the entry point
        run: |
          python -m pip install -e . --no-deps --no-build-isolation
          nn --help
      - name: Compile Python sources
        run: python -m py_compile nn/*.py tests/*.py examples/*.py
      - name: Check shell scripts
        run: |
          bash -n scripts/nn.sh
          bash -n run.example/remote.sh.example
      - name: Check the workflow body compiles
        run: |
          node <<'JS'
          const fs = require("fs");
          const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
          new AsyncFunction("agent", "phase", "log", "parallel", "args",
            fs.readFileSync(".dsh/workflows/blind-neuron-test.js", "utf8"));
          console.log("workflow body compiles");
          JS
      - name: Run the dependency-free test suite
        run: python -m unittest discover -s tests -v
